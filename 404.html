<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Rafael Viotti</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="/portifolio/assets/images/favicon/favicon.ico" sizes="any">
<link rel="stylesheet" href="/portifolio/assets/css/style.css">
<script>
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
</head>
<body>
<main class="error-page">
  <p class="error-code">404</p>
  <p class="error-message">This page does not exist, or it moved.</p>
  <p class="error-terminal"><span class="prompt">$</span> curl https://viiotti.github.io<span id="path"></span><br><span class="err">404 Not Found</span></p>
  <p><a class="btn btn--primary" href="/portifolio/">Back to the home page</a></p>
</main>
<script>document.getElementById('path').textContent = window.location.pathname;</script>
</body>
</html>
